# On a version tag (v1.4.0): run the tests, build bb-content-pull.zip and its
# SHA-256 and attach both to the GitHub release. The plugin's optional
# self-update (bb.contentpull.updates) installs exactly these assets.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zip, curl
          tools: composer:v2

      - name: Tests
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit

      - name: Tag matches composer.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(php -r 'echo json_decode(file_get_contents("composer.json"))->version;')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match composer.json version $VERSION"
            exit 1
          fi

      - name: Build release archive
        run: |
          git archive --format=zip --prefix=bb-content-pull/ -o bb-content-pull.zip "$GITHUB_REF_NAME"
          sha256sum bb-content-pull.zip > bb-content-pull.zip.sha256
          unzip -l bb-content-pull.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" bb-content-pull.zip bb-content-pull.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" bb-content-pull.zip bb-content-pull.zip.sha256 --generate-notes --title "$GITHUB_REF_NAME"
          fi
